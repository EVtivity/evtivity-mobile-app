# Build the EVtivity driver app for Android and iOS.
#
# Android builds run on free Ubuntu runners and produce an installable APK.
# iOS runs an unsigned archive on a macOS runner for verification only. Signed,
# store-ready iOS builds use `eas build --local --platform ios` with credentials
# (see release.yml and SETUP.md); CI here only proves the native project compiles.
#
# The active brand is selected by the ACTIVE_BRAND env var, sourced from the
# brand input. app.config.ts reads it at prebuild time.
#
# Triggers:
#   - workflow_dispatch: run on demand, choose the brand.
#   - workflow_call: the tag workflow (tag.yml) builds a pushed v* tag after it
#     validates the tag and the tests pass, then attaches the APK to the release.

name: build

on:
  workflow_dispatch:
    inputs:
      brand:
        description: Brand slug (must exist in brands/index.js)
        required: false
        default: default
  workflow_call:
    inputs:
      brand:
        description: Brand slug (must exist in brands/index.js)
        type: string
        required: false
        default: default

# Least privilege: jobs only check out code and upload artifacts (artifact
# uploads use the runtime token, not GITHUB_TOKEN).
permissions:
  contents: read

env:
  ACTIVE_BRAND: ${{ inputs.brand || 'default' }}

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Generate the native android/ project from app.config.ts. --no-install
      # skips re-running the package manager; deps are already installed above.
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      # The prebuild default heap (2 GB) runs out while packaging the release
      # APK (OutOfMemoryError in :app:packageRelease). The runner has 16 GB.
      - name: Raise the Gradle heap
        working-directory: android
        run: |
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          # The generated file can end without a newline: start a new line.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          grep '^org.gradle.jvmargs=' gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk-${{ env.ACTIVE_BRAND }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned verify)
    # Pinned rather than macos-latest so the image (and its Xcode set) only
    # changes on purpose. Expo SDK 57 requires Xcode 26.4 or later.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate the native ios/ project. --no-install skips the package manager
      # and CocoaPods; pods are installed in the next step.
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      # Creates the .xcworkspace the build step needs.
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      # Unsigned archive: verifies the project compiles. A signed, uploadable
      # .ipa is produced separately via `eas build --local` with credentials.
      # Prebuild names the workspace and the app scheme after the brand, so the
      # scheme is read from the workspace file name.
      - name: Build unsigned archive
        working-directory: ios
        run: |
          WORKSPACE="$(ls -d -- *.xcworkspace)"
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
